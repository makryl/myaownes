name: build
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: "makryl/SDL"
          ref: "emscripten-openfile-dialog"
          path: "external/SDL-release-3.4.16"

      - uses: actions/checkout@v7
        with:
          repository: "makryl/nes-test-roms"
          ref: "add-more-tests"
          path: "external/nes-test-roms"

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: "5.0.7"

      - name: build
        run: ./release.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist/Emscripten-Release"

      - uses: actions/deploy-pages@v4

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest --prerelease --clobber --title "MyaowNES Latest" \
            --notes "Auto build from main branch. Update time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')." \
            myaownes_latest_linux_x64.zip \
            myaownes_latest_windows_x64.zip \
            myaownes_latest_wasm32.zip
