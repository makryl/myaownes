name: build
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-cache-

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine imagemagick build-essential git make \
          pkg-config cmake ninja-build libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: "5.0.7"

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: tests
        run: |
          cmake --preset Linux-Release
          cmake --build build/Linux-Release --target myaownes-tests
          build/Linux-Release/myaownes-tests

      - run: ./release.sh

      - run: git tag -f latest && git push -f origin latest

      - uses: actions/upload-artifact@v7
        with:
          name: dist-cross
          path: dist

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: build
        run: |
          cmake --preset MacOS-Release -DCMAKE_C_FLAGS="-fprofile-generate=build/MacOS-Release/pgo" -DCMAKE_EXE_LINKER_FLAGS="-fprofile-generate=build/MacOS-Release/pgo"
          cmake --build build/MacOS-Release --clean-first --target myaownes-pgo-run

          xcrun llvm-profdata merge -output=build/MacOS-Release/pgo.profdata build/MacOS-Release/pgo

          cmake --preset MacOS-Release -DCMAKE_C_FLAGS="-fprofile-use=pgo.profdata" -DCMAKE_EXE_LINKER_FLAGS="-fprofile-use=pgo.profdata"
          cmake --build build/MacOS-Release --clean-first --target install

          (cd dist/MacOS-Release && zip -r ../myaownes_latest_macos_universal.zip *)

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist

  publish:
    runs-on: ubuntu-latest
    needs: [build-cross, build-macos]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist/Emscripten-Release"

      - uses: actions/deploy-pages@v4

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          tag_name: "latest"
          name: "Development build"
          body: "Automatic build from the main branch"
          files: |
            dist/myaownes_latest_android_arm64-v8a.apk
            dist/myaownes_latest_linux_x64.zip
            dist/myaownes_latest_macos_universal.zip
            dist/myaownes_latest_wasm32.zip
            dist/myaownes_latest_windows_x64.zip
